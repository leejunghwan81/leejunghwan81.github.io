<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 성일중학교 코딩동아리 작품소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f8fc;
        }
        .card-hover {
            transition: all 0.25s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px -8px rgba(14, 116, 144, 0.15), 0 8px 16px -4px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

    <!-- 메인 컨테이너 (전체 화면 최적화) -->
    <div class="w-full max-w-[1800px] mx-auto px-8 py-8 flex-grow flex flex-col justify-between">
        
        <!-- 상단 헤더 영역 -->
        <header class="text-center my-4">
            <!-- 소제목 배지 -->
            <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-blue-100 text-blue-700 font-bold text-lg mb-3 shadow-sm border border-blue-200">
                <i class="fa-solid fa-code"></i>
                <span>코딩동아리 전시회</span>
            </div>
            
            <!-- 메인 타이틀 -->
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight leading-tight mb-3">
                2026 성일중학교 코딩동아리 작품소개
            </h1>
            
            <!-- 서브 타이틀 및 작품 수 -->
            <div class="flex items-center justify-center gap-3 text-slate-600 font-medium text-lg">
                <span>학생들의 창의적인 아이디어와 노력이 담긴 프로젝트입니다.</span>
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                <span class="text-blue-600 font-bold bg-blue-50 px-3 py-1 rounded-md border border-blue-200">
                    총 18개 작품
                </span>
            </div>
        </header>

        <!-- 작품 그리드 영역 (1920 해상도 맞춤 3컬럼 고정) -->
        <main class="my-6">
            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 자바스크립트로 카드가 동적 생성됩니다 -->
            </div>
        </main>

        <!-- 푸터 영역 -->
        <footer class="mt-8 text-center text-slate-400 text-sm py-4 border-t border-slate-200">
            <p>© 2026 성일중학교 코딩동아리. All rights reserved.</p>
        </footer>
    </div>

    <!-- 팝업 차단 발생 시 대체용 모달 -->
    <div id="fallback-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-center">
            <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </div>
            <h3 id="modal-student-info" class="text-sm font-semibold text-blue-600 mb-1">학번 이름</h3>
            <h2 id="modal-title" class="text-2xl font-bold text-slate-900 mb-3">작품명</h2>
            <p class="text-slate-600 text-sm mb-6">
                브라우저 팝업 차단 설정으로 인해 창이 자동으로 열리지 않았습니다.<br>아래 버튼을 눌러 새 창에서 작품을 실행해주세요.
            </p>
            <div class="flex gap-3">
                <button onclick="closeFallbackModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition">
                    닫기
                </button>
                <a id="modal-url-btn" href="#" target="_blank" onclick="closeFallbackModal()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    <span>작품 실행하기</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 18명 학생 결과물 데이터
        const projectsData = [
            { id: 1, studentId: "2415", name: "변승훈", title: "아포칼립스 리라이즈", url: "https://ais-pre-ye77mltzvluemvkhyshzmv-449619530501.asia-northeast1.run.app" },            
            { id: 3, studentId: "3108", name: "김하준", title: "손바닥 뒤집기", url: "https://ais-pre-ydfadzwzma7lpqtrqwssxl-756708683020.asia-east1.run.app" },
            { id: 4, studentId: "3116", name: "이승호", title: "총게임", url: "https://ais-pre-sa3ykauy5bhgfxd76s65dp-449782790203.asia-northeast1.run.app" },
            { id: 5, studentId: "3207", name: "김영주", title: "인크레멘탈", url: "https://ais-pre-7bg5xqzmj3lchcfcsp4m35-756685335458.asia-east1.run.app" },
            { id: 6, studentId: "3210", name: "방시우", title: "미궁 fps", url: "https://ais-pre-ldgbejrhuf5tvcciu6looo-449562437311.asia-northeast1.run.app" },
            { id: 7, studentId: "3223", name: "정주안", title: "용 키우기", url: "https://ais-pre-7qzofk47dh3txva6466ak2-756695277875.asia-east1.run.app/" },
            { id: 8, studentId: "3304", name: "김민준", title: "부처 키우기", url: "https://ais-pre-q2lhwspgem5hvgbrcst323-449598977721.asia-northeast1.run.app" },
            { id: 9, studentId: "3516", name: "이건희", title: "총게임", url: "https://ais-pre-kucoxhmtku5qrfxe3uhpwl-449585008615.asia-northeast1.run.app" },
            { id: 10, studentId: "3620", name: "정민혁", title: "바운스볼", url: "https://ais-pre-tv4rmjb4dsf73psijswhl4-756711470305.asia-east1.run.app" },
            { id: 11, studentId: "3621", name: "정유한", title: "총게임fps", url: "https://ais-pre-zyvomqbbne6jx6c5r63hpt-756699398781.asia-east1.run.app" },
            { id: 12, studentId: "3623", name: "조인성", title: "자동차 피하기", url: "https://ais-pre-qu7ixzincncb3brwkrhone-449606811969.asia-northeast1.run.app" },            
            { id: 14, studentId: "3719", name: "이시후", title: "비행기가 떨어져", url: "https://ais-pre-lqqsqvn3cqarfuxt4u5jc3-449575815025.asia-northeast1.run.app" },
            { id: 15, studentId: "3804", name: "김다희", title: "AI와 포커심리", url: "https://ais-pre-khiylirb5gayagwtafkjlv-449604878826.asia-northeast1.run.app" },
            { id: 16, studentId: "3809", name: "김민", title: "초록빛 나무 키우기", url: "https://ais-pre-tnvz3r4ilz2doowhofdcpe-449553390495.asia-northeast1.run.app" },
            { id: 17, studentId: "3707", name: "나우찬", title: "체스", url: "https://ais-pre-5rt2jpoodrckw7qlxwasfw-449588175385.asia-northeast1.run.app" },
            { id: 18, studentId: "2505", name: "김은율", title: "언데드 프로토콜 : 제로", url: "https://ais-pre-zemnjudallgdolpxttxg4t-449604994127.asia-northeast1.run.app" }
        ];

        // 팝업 창 규격 설정
        const POPUP_WIDTH = 1280;
        const POPUP_HEIGHT = 800;

        // 화면 로드 시 카드 렌더링
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
        });

        function renderProjects() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = projectsData.map(project => `
                <div onclick="openProjectPopup(${project.id})" 
                     class="card-hover bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm cursor-pointer flex flex-col justify-between group">
                    <div>
                        <!-- 상단 학번/이름 영역 -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 group-hover:bg-blue-50 group-hover:text-blue-600 transition">
                                <i class="fa-solid fa-id-card mr-1.5 opacity-70"></i>${project.studentId} ${project.name}
                            </span>
                            <span class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition">
                                <i class="fa-solid fa-play text-xs ml-0.5"></i>
                            </span>
                        </div>
                        
                        <!-- 작품 제목 -->
                        <h2 class="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition line-clamp-2 mb-2">
                            ${project.title}
                        </h2>
                    </div>

                    <!-- 하단 안내 문구 -->
                    <div class="pt-4 mt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 group-hover:text-slate-500">
                        <span>클릭하여 작품 실행 (새 창)</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-slate-300 group-hover:text-blue-500 transition"></i>
                    </div>
                </div>
            `).join('');
        }

        // 팝업 실행 로직
        function openProjectPopup(id) {
            const project = projectsData.find(p => p.id === id);
            if (!project) return;

            // 모니터 화면 중앙 위치 계산
            const left = Math.max(0, (window.screen.width - POPUP_WIDTH) / 2);
            const top = Math.max(0, (window.screen.height - POPUP_HEIGHT) / 2);

            const windowFeatures = `width=${POPUP_WIDTH},height=${POPUP_HEIGHT},top=${top},left=${left},scrollbars=yes,resizable=yes,status=no,toolbar=no,menubar=no`;

            // 팝업 생성
            const newWindow = window.open(project.url, `project_${project.id}`, windowFeatures);

            // 브라우저 팝업 차단 시 대체 모달 표시
            if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                showFallbackModal(project);
            }
        }

        function showFallbackModal(project) {
            document.getElementById('modal-student-info').textContent = `${project.studentId} ${project.name}`;
            document.getElementById('modal-title').textContent = project.title;
            document.getElementById('modal-url-btn').href = project.url;
            document.getElementById('fallback-modal').classList.remove('hidden');
        }

        function closeFallbackModal() {
            document.getElementById('fallback-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
